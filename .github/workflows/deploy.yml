# Deploys main to Cloud Run through the existing cloudbuild.yaml pipeline.
#
# Authentication is keyless: GitHub issues an OIDC token for this workflow run
# and Google Cloud's Workload Identity Federation exchanges it for short-lived
# credentials of the rosemont-deployer service account. The federation
# provider only accepts tokens from this repository, and the "production"
# environment only allows deployments from the main branch, so a pull request
# (including one from a fork) can never trigger a deploy. There are no
# long-lived cloud keys stored in GitHub.
name: Deploy

on:
  push:
    branches: [main, ci-cd] # TEMPORARY: ci-cd added to verify the workflow before merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: permitting-ai-helper
  GCP_REGION: us-east4
  SERVICE: rosemont-club
  WORKLOAD_IDENTITY_PROVIDER: projects/650621702399/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER_SERVICE_ACCOUNT: rosemont-deployer@permitting-ai-helper.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://rosemont.club
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A last gate before shipping, in case a merge bypassed the CI checks.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The staging directory is given explicitly. Without it, gcloud verifies
      # the default bucket by listing every bucket in the project, which the
      # deployer is deliberately not allowed to do.
      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project "$GCP_PROJECT" \
            --gcs-source-staging-dir "gs://${GCP_PROJECT}_cloudbuild/source" \
            --quiet

      - name: Verify the live service
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT" \
            --format 'value(status.latestReadyRevisionName)')
          echo "Serving revision: $revision"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://rosemont.club/api/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
