substitutions:
  _SERVICE: rosemont-club
  _REGION: us-east4
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID', .]
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--service-account=rosemont-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--env-vars-file=deploy-env.yaml'
      - '--set-secrets=MAILGUN_API_KEY=ROSEMONT_MAILGUN_API_KEY:latest,MAILGUN_DOMAIN=ROSEMONT_MAILGUN_DOMAIN:latest,MAIL_FROM=ROSEMONT_MAIL_FROM:latest,ADDRESS_KEY=ROSEMONT_ADDRESS_KEY:latest'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=40'
      - '--timeout=60'
      - '--port=8080'
      - '--startup-probe=httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=2,periodSeconds=5,failureThreshold=12'
      - '--quiet'
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID']
